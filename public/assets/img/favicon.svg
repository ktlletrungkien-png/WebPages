<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="earth-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="atmosphere" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#030c18" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#020813"/>
  <!-- Atmosphere Outer Glow -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Earth Globe -->
  <circle cx="32" cy="32" r="16" fill="url(#atmosphere)"/>
  <!-- Continents shapes -->
  <path d="M24 26 C26 22, 32 23, 35 25 C37 28, 33 30, 30 31 C27 32, 23 29, 24 26 Z" fill="#10b981" opacity="0.9"/>
  <path d="M34 32 C38 31, 41 35, 39 39 C36 42, 33 40, 32 37 C31 34, 33 33, 34 32 Z" fill="#34d399" opacity="0.85"/>
  <path d="M22 36 C24 35, 26 38, 25 41 C23 43, 21 40, 22 36 Z" fill="#10b981" opacity="0.8"/>
  <!-- Orbit Ring -->
  <ellipse cx="32" cy="32" rx="26" ry="9" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.75" transform="rotate(-30 32 32)"/>
  <!-- Orbiting Satellite Beacon -->
  <circle cx="51" cy="18" r="2.8" fill="#00f2fe"/>
  <circle cx="51" cy="18" r="5" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.6"/>
</svg>
