<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-label="Orbital Drift — hành tinh tím với những vòng quỹ đạo">
  <defs>
    <linearGradient id="orb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080714"/>
      <stop offset="1" stop-color="#1a1040"/>
    </linearGradient>
    <radialGradient id="orb-planet" cx="32%" cy="26%" r="78%">
      <stop offset="0" stop-color="#fbe8ff"/>
      <stop offset=".22" stop-color="#e9a7f9"/>
      <stop offset=".48" stop-color="#9d6bff"/>
      <stop offset=".76" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#100a28"/>
    </radialGradient>
    <linearGradient id="orb-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".1"/>
      <stop offset=".45" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="orb-moon" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffd9b0"/>
      <stop offset=".6" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </radialGradient>
    <filter id="orb-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="orb-soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="orb-noise">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="orb-grid" width="62" height="62" patternUnits="userSpaceOnUse">
      <path d="M62 0H0V62" fill="none" stroke="#b8a7ff" stroke-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1000" height="750" fill="url(#orb-bg)"/>
  <rect width="1000" height="750" fill="url(#orb-grid)"/>

  <g fill="#fff">
    <circle cx="152" cy="128" r="2" opacity=".8"/>
    <circle cx="312" cy="92" r="1.2" opacity=".5"/>
    <circle cx="884" cy="112" r="1.6" opacity=".7"/>
    <circle cx="820" cy="300" r="1" opacity=".45"/>
    <circle cx="110" cy="520" r="1.5" opacity=".6"/>
    <circle cx="248" cy="642" r="1" opacity=".4"/>
    <circle cx="792" cy="656" r="2" opacity=".55"/>
    <circle cx="944" cy="486" r="1.2" opacity=".5"/>
  </g>

  <circle cx="636" cy="398" r="235" fill="#7c3aed" opacity=".34" filter="url(#orb-glow)"/>

  <g transform="rotate(-17 636 398)">
    <ellipse cx="636" cy="398" rx="348" ry="108" fill="none" stroke="url(#orb-ring)" stroke-width="1.4" opacity=".65"/>
    <ellipse cx="636" cy="398" rx="292" ry="84" fill="none" stroke="#f0abfc" stroke-width="1" opacity=".32"/>
  </g>
  <g transform="rotate(64 636 398)">
    <ellipse cx="636" cy="398" rx="300" ry="88" fill="none" stroke="#22d3ee" stroke-width="0.9" opacity=".28" stroke-dasharray="3 9"/>
  </g>

  <circle cx="636" cy="398" r="168" fill="url(#orb-planet)"/>
  <ellipse cx="584" cy="342" rx="74" ry="38" fill="#fff" opacity=".12" filter="url(#orb-soft)"/>
  <path d="M498 454c48 30 120 36 176 10 38-18 66-46 82-80-4 78-56 144-126 158-58 11-111-12-146-56-7-9-2-22 14-32z" fill="#05030f" opacity=".28"/>

  <g transform="rotate(-17 636 398)">
    <path d="M288 398a348 108 0 0 0 696 0" fill="none" stroke="url(#orb-ring)" stroke-width="2.2" opacity=".85"/>
  </g>

  <circle cx="860" cy="536" r="30" fill="#fb923c" opacity=".55" filter="url(#orb-glow)"/>
  <circle cx="860" cy="536" r="21" fill="url(#orb-moon)"/>
  <circle cx="852" cy="528" r="7" fill="#fed7aa" opacity=".35"/>

  <g fill="#e9e4ff" font-family="'Space Grotesk', 'Helvetica Neue', sans-serif">
    <text x="64" y="86" font-size="12" letter-spacing="4" opacity=".55">UNIVERSE / CASE 01</text>
    <text x="64" y="662" font-size="34" font-weight="600" letter-spacing="-.5">Orbital Drift</text>
    <text x="64" y="690" font-size="12" letter-spacing="3" opacity=".45">GAME DESIGN · UI · 2026</text>
  </g>
  <g stroke="#fff" opacity=".32">
    <path d="M900 150v22M889 161h22"/>
    <path d="M120 350v14M113 357h14"/>
  </g>

  <rect width="1000" height="750" filter="url(#orb-noise)" opacity=".045"/>
</svg>
