<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-label="Atlas of Small Things — bố cục biên tập với chữ lớn và các khối màu">
  <defs>
    <linearGradient id="atl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eee7d7"/>
      <stop offset="1" stop-color="#e2d8c3"/>
    </linearGradient>
    <linearGradient id="atl-img1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="atl-img2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="atl-img3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#052e2b"/>
    </linearGradient>
    <filter id="atl-noise">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="atl-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141414" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1000" height="750" fill="url(#atl-bg)"/>
  <rect width="1000" height="750" fill="url(#atl-grid)"/>

  <circle cx="816" cy="196" r="104" fill="#e2401b"/>
  <path d="M712 196h208M816 92v208" stroke="#141414" stroke-width="1" opacity=".35"/>

  <g fill="#141414" font-family="Georgia, 'Times New Roman', serif">
    <text x="56" y="212" font-size="170" letter-spacing="-8">ATLAS</text>
    <text x="56" y="286" font-size="46" font-style="italic" letter-spacing="-.5">of small things</text>
  </g>

  <g fill="#141414" font-family="'Space Grotesk', 'Helvetica Neue', sans-serif">
    <text x="58" y="84" font-size="11" letter-spacing="4" opacity=".6">UNIVERSE / CASE 06</text>
    <text x="58" y="352" font-size="12" letter-spacing="1.5" opacity=".65">A FIELD GUIDE TO THE EVERYDAY</text>
    <text x="58" y="712" font-size="11" letter-spacing="3" opacity=".55">EDITORIAL · WEB DESIGN · 2023</text>
    <text x="940" y="712" font-size="11" letter-spacing="2" text-anchor="end" opacity=".55">VOL. 03</text>
  </g>

  <g transform="translate(58 400)">
    <rect width="264" height="264" fill="url(#atl-img1)"/>
    <rect x="24" y="24" width="216" height="216" fill="none" stroke="#fff" stroke-opacity=".45"/>
    <circle cx="132" cy="132" r="58" fill="none" stroke="#fff" stroke-width="1.5" opacity=".7"/>
    <path d="M74 132h116M132 74v116" stroke="#fff" stroke-width=".8" opacity=".6"/>
    <text x="132" y="264" font-family="'Space Grotesk', sans-serif" font-size="10" letter-spacing="2" fill="#fff" text-anchor="middle" opacity=".8">FIG. 01 / TIDE POOL</text>
  </g>

  <g transform="translate(350 400)">
    <rect width="190" height="126" fill="url(#atl-img2)"/>
    <rect y="142" width="190" height="122" fill="url(#atl-img3)"/>
    <text x="20" y="166" font-family="Georgia, serif" font-size="26" fill="#141414">02</text>
    <text x="20" y="188" font-family="'Space Grotesk', sans-serif" font-size="10" letter-spacing="1.5" fill="#141414" opacity=".65">FIELD NOTES</text>
    <path d="M120 158h48M120 166h30" stroke="#141414" opacity=".4"/>
  </g>

  <g transform="translate(566 400)">
    <rect width="376" height="172" fill="#f6f1e5" stroke="#141414" stroke-opacity=".16"/>
    <text x="24" y="42" font-family="Georgia, serif" font-size="43" fill="#141414">Small</text>
    <text x="24" y="84" font-family="Georgia, serif" font-size="43" font-style="italic" fill="#141414">things,</text>
    <text x="24" y="126" font-family="Georgia, serif" font-size="43" fill="#141414">big worlds.</text>
    <text x="24" y="152" font-family="'Be Vietnam Pro', sans-serif" font-size="9" letter-spacing="1.2" fill="#141414" opacity=".55">ESSAYS · MAPS · OBSERVATIONS</text>
    <rect x="298" y="24" width="54" height="124" fill="none" stroke="#141414" stroke-opacity=".2"/>
    <circle cx="325" cy="86" r="15" fill="#e2401b"/>
  </g>

  <path d="M58 374h884" stroke="#141414" stroke-opacity=".2"/>

  <rect width="1000" height="750" filter="url(#atl-noise)" opacity=".05"/>
</svg>
