<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-label="Signal/Noise — poster nhận diện với kiểu chữ đậm trên nền kem">
  <defs>
    <linearGradient id="sig-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4efe4"/>
      <stop offset="1" stop-color="#e7dfcf"/>
    </linearGradient>
    <filter id="sig-noise">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="sig-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#141414" stroke-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1000" height="750" fill="url(#sig-bg)"/>
  <rect width="1000" height="750" fill="url(#sig-grid)"/>

  <circle cx="790" cy="252" r="130" fill="#ff4d1c"/>
  <circle cx="790" cy="252" r="130" fill="none" stroke="#141414" stroke-width="1.5"/>
  <path d="M660 252h260M790 122v260" stroke="#141414" stroke-width="1" opacity=".35"/>

