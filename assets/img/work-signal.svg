    <text x="58" y="470" font-size="196" font-weight="700" letter-spacing="-12" fill="none" stroke="#141414" stroke-width="2.5">NOISE</text>
  </g>

  <g stroke="#141414" stroke-linecap="round">
    <path d="M62 556v44M82 538v80M102 566v28M122 520v112M142 552v52M162 572v18M182 530v86M202 558v40M222 544v62M242 574v14M262 534v78M282 562v32M302 548v58M322 576v10M342 536v76M362 560v36M382 550v54M402 570v16M422 528v90M442 556v40M462 542v64M482 572v14M502 534v80M522 562v34M542 548v60M562 578v8M582 538v74M602 558v38M622 546v58M642 568v18M662 530v86M682 554v44M702 540v70M722 574v12M742 534v80M762 560v36M782 548v58M802 576v10M822 536v78M842 558v38M862 544v62M882 570v16M902 528v92M922 552v44M942 540v70" stroke-width="3" opacity=".8"/>
  </g>

  <g fill="#141414" font-family="'Space Grotesk', 'Helvetica Neue', sans-serif">
    <text x="58" y="82" font-size="11" letter-spacing="4" opacity=".6">UNIVERSE / CASE 03</text>
    <text x="58" y="700" font-size="32" font-weight="600" letter-spacing="-.4">Signal/Noise</text>
