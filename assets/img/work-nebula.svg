<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-label="Nebula OS — giao diện cộng tác trên nền tinh vân">
  <defs>
    <linearGradient id="neb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080813"/>
      <stop offset="1" stop-color="#11112a"/>
    </linearGradient>
    <linearGradient id="neb-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="neb-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
    <filter id="neb-blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="72"/>
    </filter>
    <filter id="neb-noise">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="neb-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#fff" opacity=".10"/>
    </pattern>
  </defs>

  <rect width="1000" height="750" fill="url(#neb-bg)"/>
  <circle cx="248" cy="152" r="190" fill="#7c3aed" opacity=".5" filter="url(#neb-blur)"/>
  <circle cx="806" cy="610" r="210" fill="#0e7490" opacity=".55" filter="url(#neb-blur)"/>
  <circle cx="700" cy="180" r="120" fill="#db2777" opacity=".22" filter="url(#neb-blur)"/>
  <rect width="1000" height="750" fill="url(#neb-dots)"/>

  <g font-family="'Space Grotesk', 'Helvetica Neue', sans-serif">
    <text x="64" y="84" font-size="12" letter-spacing="4" fill="#e9e4ff" opacity=".55">UNIVERSE / CASE 02</text>
    <text x="64" y="666" font-size="34" font-weight="600" letter-spacing="-.5" fill="#e9e4ff">Nebula OS</text>
    <text x="64" y="694" font-size="12" letter-spacing="3" fill="#e9e4ff" opacity=".45">PRODUCT · DESIGN SYSTEM · 2025</text>
  </g>

  <g transform="translate(300 170) rotate(-4 230 160)">
    <rect width="470" height="330" rx="20" fill="url(#neb-panel)" stroke="#fff" stroke-opacity=".16"/>
    <rect width="470" height="48" rx="20" fill="#fff" fill-opacity=".04"/>
    <circle cx="26" cy="24" r="5" fill="#f87171" opacity=".8"/>
    <circle cx="44" cy="24" r="5" fill="#fbbf24" opacity=".8"/>
    <circle cx="62" cy="24" r="5" fill="#34d399" opacity=".8"/>
    <rect x="92" y="17" width="120" height="14" rx="7" fill="#fff" fill-opacity=".1"/>
    <rect x="360" y="15" width="86" height="18" rx="9" fill="url(#neb-accent)" opacity=".8"/>

    <rect x="22" y="70" width="92" height="236" rx="12" fill="#fff" fill-opacity=".03"/>
    <rect x="36" y="88" width="62" height="8" rx="4" fill="#fff" fill-opacity=".28"/>
    <rect x="36" y="110" width="48" height="7" rx="3.5" fill="#fff" fill-opacity=".13"/>
    <rect x="36" y="130" width="56" height="7" rx="3.5" fill="#fff" fill-opacity=".13"/>
    <rect x="36" y="150" width="40" height="7" rx="3.5" fill="#fff" fill-opacity=".13"/>

    <rect x="132" y="70" width="196" height="120" rx="12" fill="url(#neb-accent)" opacity=".18" stroke="#a78bfa" stroke-opacity=".35"/>
    <circle cx="230" cy="126" r="36" fill="none" stroke="url(#neb-accent)" stroke-width="1.5"/>
    <circle cx="230" cy="126" r="20" fill="url(#neb-accent)" opacity=".55"/>
    <circle cx="230" cy="126" r="6" fill="#fff" opacity=".9"/>
    <rect x="148" y="166" width="76" height="7" rx="3.5" fill="#fff" fill-opacity=".26"/>

    <rect x="344" y="70" width="104" height="56" rx="10" fill="#fff" fill-opacity=".06"/>
    <rect x="358" y="86" width="48" height="6" rx="3" fill="#fff" fill-opacity=".3"/>
    <rect x="358" y="100" width="70" height="12" rx="6" fill="#22d3ee" fill-opacity=".55"/>

    <rect x="344" y="138" width="104" height="52" rx="10" fill="#fff" fill-opacity=".05"/>
    <rect x="358" y="154" width="40" height="6" rx="3" fill="#fff" fill-opacity=".24"/>
    <rect x="358" y="167" width="58" height="10" rx="5" fill="#8b5cf6" fill-opacity=".65"/>

    <rect x="132" y="206" width="316" height="100" rx="12" fill="#fff" fill-opacity=".035"/>
    <path d="M152 282c22-4 28-34 50-32s26 22 46 18 24-42 48-40 24 30 44 26 22-20 38-24" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
    <path d="M152 292c22-4 28-34 50-32s26 22 46 18 24-42 48-40 24 30 44 26 22-20 38-24" fill="none" stroke="#a78bfa" stroke-width="1" stroke-linecap="round" opacity=".4"/>
    <rect x="150" y="222" width="54" height="7" rx="3.5" fill="#fff" fill-opacity=".24"/>
  </g>

  <g transform="translate(170 540)">
    <rect width="286" height="64" rx="32" fill="#0b0b18" stroke="#fff" stroke-opacity=".18"/>
    <circle cx="33" cy="32" r="15" fill="url(#neb-accent)"/>
    <text x="33" y="37" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#07070f" text-anchor="middle">M</text>
    <text x="60" y="29" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#fff" opacity=".85">Mai Linh đang chỉnh sửa</text>
    <text x="60" y="45" font-family="'Be Vietnam Pro', sans-serif" font-size="10" fill="#fff" opacity=".4">Design system / v2.4</text>
  </g>

  <g transform="translate(738 418)">
    <path d="M0 0l26 30-12 2-7 13z" fill="#fff" stroke="#0b0b18" stroke-width="1.5"/>
    <rect x="18" y="34" width="58" height="22" rx="11" fill="#22d3ee"/>
    <text x="47" y="49" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="600" fill="#062124" text-anchor="middle">Universe</text>
  </g>

  <g stroke="#fff" opacity=".1">
    <path d="M64 116h64M64 125h38"/>
    <path d="M936 84v48M912 108h48"/>
  </g>

  <rect width="1000" height="750" filter="url(#neb-noise)" opacity=".04"/>
</svg>
